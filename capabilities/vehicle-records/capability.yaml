apiVersion: aiba.dev/v0alpha1
kind: Capability
metadata:
  id: vehicle-records
  version: 0.1.0
  title: Vehicle Records
  layer: business-capability
  description: >-
    Authorized, tenant-scoped vehicle lifecycle records with normalized unique
    identifiers, bounded fields, optimistic concurrency, controlled status
    transitions, idempotent creation, and attributable mutations.
spec:
  interfaces:
    - identity.principal
    - authorization.decision
    - audit.event
    - vehicle-records.create-command
    - vehicle-records.update-command
    - vehicle-records.record
  dependencies:
    - id: authorization
      version: ^0.1.0
      optional: false
    - id: audit
      version: ^0.1.0
      optional: false
  invariants:
    - id: vehicle-operations-are-authorized
      title: Vehicle operations are authorized
      description: Create, read, list, and update each require an explicit decision over the trusted tenant and target resource.
      severity: critical
      evidence: &vehicleEvidence
        acceptedTypes: [source, test, config, document]
        requiredTypes: [source, test]
        minimum: 2
        requireHash: true
    - id: tenant-comes-from-trusted-context
      title: Tenant comes from trusted context
      description: Commands, identifiers, filters, and stored fields cannot choose or override the tenant used for access and persistence.
      severity: critical
      evidence: *vehicleEvidence
    - id: vehicle-identities-are-server-owned
      title: Vehicle identities are server owned
      description: Opaque vehicle identifiers are generated by the trusted service and cannot be supplied by create commands.
      severity: critical
      evidence: *vehicleEvidence
    - id: identifiers-are-normalized-and-tenant-unique
      title: Identifiers are normalized and tenant unique
      description: Fleet number, plate number, and optional VIN are normalized before tenant-scoped uniqueness checks and storage.
      severity: critical
      evidence: *vehicleEvidence
    - id: vehicle-input-is-bounded
      title: Vehicle input is bounded
      description: Commands reject unknown fields, malformed identifiers, implausible years, invalid mileage, and oversized text.
      severity: error
      evidence: *vehicleEvidence
    - id: updates-use-optimistic-concurrency
      title: Updates use optimistic concurrency
      description: Mutations bind the expected revision and reject stale writes without changing the record.
      severity: critical
      evidence: *vehicleEvidence
    - id: lifecycle-transitions-are-controlled
      title: Lifecycle transitions are controlled
      description: Only declared status transitions are accepted and retired vehicles cannot return to an operational state.
      severity: critical
      evidence: *vehicleEvidence
    - id: vehicle-creation-is-idempotent
      title: Vehicle creation is idempotent
      description: A tenant-scoped key returns the original result only for the same normalized command and rejects conflicting reuse.
      severity: error
      evidence: *vehicleEvidence
    - id: mutations-and-audit-are-atomic-and-minimized
      title: Mutations and audit are atomic and minimized
      description: Successful mutations and their audit outcome commit together while audit excludes plate numbers, VINs, and arbitrary record payloads.
      severity: critical
      evidence: *vehicleEvidence
