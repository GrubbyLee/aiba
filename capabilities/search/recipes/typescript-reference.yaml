apiVersion: aiba.dev/v0alpha1
kind: CapabilityRecipe
metadata:
  id: typescript-reference
  version: 0.1.0
  title: TypeScript Search Boundary
  description: Framework-neutral guidance for authorization-first bounded search.
spec:
  capability: { id: search, version: 0.1.0 }
  compatibility: { languages: [TypeScript], frameworks: [] }
  writeScope: { allowedPatterns: [src/**, server/**, test/**, tests/**] }
  operations:
    - id: search-authorized-resources
      intent: Apply trusted tenant and authorization predicates before matching and paginating allowlisted projections.
      requiredInterfaces: [search.query, search.page, authorization.decision]
      invariants: [search-scope-is-trusted, authorization-precedes-ranking, query-and-output-are-bounded, cursors-are-opaque-and-bound, search-projections-are-safe]
      guidance:
        - Compile principal and tenant authorization into the datastore query before ranking when possible.
        - Bind signed cursor state to normalized query, resource types, tenant, and principal.
        - Return only allowlisted title and snippet projections; omit unauthorized totals and facets.
  evidence:
    - invariant: search-scope-is-trusted
      suggestions: &suggestions
        - { type: source, pathPattern: "src/**/*.ts", description: "Tenant-scoped authorization-first search and cursor boundary." }
        - { type: test, pathPattern: "src/**/*.test.ts", description: "Scope, authorization leakage, bounds, projection, cursor tamper, and replay tests." }
    - { invariant: authorization-precedes-ranking, suggestions: *suggestions }
    - { invariant: query-and-output-are-bounded, suggestions: *suggestions }
    - { invariant: cursors-are-opaque-and-bound, suggestions: *suggestions }
    - { invariant: search-projections-are-safe, suggestions: *suggestions }
