apiVersion: aiba.dev/v0alpha1
kind: OperationPlan
metadata:
  id: review-access-install
  createdAt: 2026-07-25T18:57:03.876Z
capability:
  id: review-access
  version: 0.1.0
  manifestSha256: 92cf34a81a7e9e6a291ff1c13f659a92b504122266dc4dbe3396996472dd71a4
recipe:
  id: wechat-native
  version: 0.1.0
  sha256: 1cd51366403b6cea0e8279076e6c8d86acfd7ca170d49562d477977f67a72752
project:
  name: "@aiba/fixture-review-access-wechat-native"
  stack:
    languages:
      - TypeScript
      - JavaScript
      - WeChat WXSS
      - WeChat WXML
    frameworks:
      - WeChat Mini Program
writeScope:
  allowedPatterns:
    - miniprogram/**
    - src/**
operations:
  - id: add-review-entry
    intent: Add a reviewer-facing Mini Program entry that submits only credential
      and release identity.
    requiredInterfaces:
      - identity.principal
    invariants:
      - client-cannot-self-assert-reviewer
      - reviewer-is-distinct-principal
    guidance:
      - Do not place enablement, reviewer roles, scopes, secrets, or production
        data rules in Mini Program code.
      - Keep reviewer session tokens in memory and use a dedicated reviewer
        principal returned by the server.
  - id: enforce-server-policy
    intent: Enforce release binding, enablement, expiration, revocation, and rate
      limits in trusted server state.
    requiredInterfaces:
      - identity.principal
      - authorization.decision
    invariants:
      - server-authoritative-enable
      - access-expires
      - access-is-revocable
      - attempts-are-rate-limited
    guidance:
      - Derive the rate-limit key from trusted transport metadata rather than
        request body fields.
      - Re-evaluate policy while authorizing an existing review session.
  - id: isolate-review-capabilities
    intent: Expose only fixed review operations backed by isolated or sanitized data.
    requiredInterfaces:
      - authorization.decision
    invariants:
      - scope-is-least-privilege
      - production-data-is-isolated
    guidance:
      - Map each endpoint to a server-owned scope instead of accepting arbitrary
        scope input.
      - Inject an isolated review dataset without a production-data fallback.
  - id: audit-review-boundary
    intent: Emit attributable audit events for authentication, authorization,
      denial, and revocation.
    requiredInterfaces:
      - audit.event
    invariants:
      - actions-are-audited
    guidance:
      - Record outcomes and reason codes without logging raw credentials or
        session tokens.
evidence:
  - invariant: reviewer-is-distinct-principal
    requirements: &a1
      acceptedTypes:
        - source
        - test
        - document
      requiredTypes:
        - source
        - test
      minimum: 2
      requireHash: true
    suggestions: &a2
      - type: source
        pathPattern: src/server/**/*.ts
        description: Server-authoritative review access implementation.
      - type: test
        pathPattern: src/**/*.test.ts
        description: Black-box review access attack tests.
    items:
      - type: source
        path: src/server/reviewAccessApi.ts
        description: Server-authoritative review access boundary.
      - type: test
        path: src/reviewAccessHttp.blackbox.test.ts
        description: End-to-end HTTP security and abuse tests.
