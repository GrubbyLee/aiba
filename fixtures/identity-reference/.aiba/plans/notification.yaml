apiVersion: aiba.dev/v0alpha1
kind: OperationPlan
metadata:
  id: notification-install
  createdAt: 2026-07-26T00:09:00.000Z
capability:
  id: notification
  version: 0.1.0
  manifestSha256: e1ca75df0c7eb3c2257fab702e27450cbc7e6845242b03a04ed7f853bb68470b
recipe:
  id: typescript-reference
  version: 0.1.0
  sha256: d3c7003c91046defcc47adcd57cfb69552df2b66d19d8eb9d6b92b4d59dd4896
project:
  name: "@aiba/fixture-identity-reference"
  stack:
    languages:
      - TypeScript
    frameworks: []
writeScope:
  allowedPatterns:
    - src/**
    - server/**
    - test/**
    - tests/**
    - cloudfunctions/**
operations:
  - id: establish-notification-command
    intent: Accept a bounded template command while deriving tenant and recipient
      destination from trusted state.
    requiredInterfaces:
      - identity.principal
      - notification.command
    invariants:
      - tenant-comes-from-trusted-context
      - content-uses-trusted-templates
      - recipient-destination-is-server-resolved
    guidance:
      - Reject tenant, address, body, provider, credential, and provider-options
        fields.
      - Resolve an enabled server template and allow only its declared parameter
        keys.
  - id: authorize-and-check-consent
    intent: Authorize the recipient resource and enforce channel consent before
      provider invocation.
    requiredInterfaces:
      - authorization.decision
    invariants:
      - send-is-authorized
      - consent-is-enforced
    guidance:
      - Evaluate notification send permission over the trusted tenant and
        recipient reference.
      - Suppress delivery without exposing raw destination or preference records.
  - id: establish-idempotent-delivery
    intent: Bind one command fingerprint to a durable tenant-scoped key and an
      idempotent provider call.
    requiredInterfaces:
      - notification.receipt
    invariants:
      - delivery-is-idempotent
      - delivery-failure-is-visible
    guidance:
      - Persist key, command fingerprint, and final receipt through a shared
        single-flight boundary.
      - Propagate the same opaque idempotency key to a provider that guarantees
        duplicate suppression.
  - id: minimize-notification-provenance
    intent: Return and audit only delivery metadata that cannot be reused as a
      destination or secret.
    requiredInterfaces:
      - audit.event
      - notification.receipt
    invariants:
      - receipts-and-audit-are-minimized
    guidance:
      - Exclude destination, parameters, provider request/response, and
        credentials from receipts and events.
      - Record sent, suppressed, and failed outcomes with template and recipient
        references only where policy permits.
evidence:
  - invariant: send-is-authorized
    requirements: &a1
      acceptedTypes:
        - source
        - test
        - config
        - document
      requiredTypes:
        - source
        - test
      minimum: 2
      requireHash: true
    suggestions: &a2
      - type: source
        pathPattern: src/**/*.ts
        description: Notification command and delivery implementation.
      - type: test
        pathPattern: src/**/*.test.ts
        description: Authorization, consent, idempotency, and redaction tests.
    items:
      - type: source
        path: src/notification.ts
        ownership: shared
      - type: test
        path: src/notification.test.ts
        ownership: shared
  - invariant: tenant-comes-from-trusted-context
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/notification.ts
        ownership: shared
      - type: test
        path: src/notification.test.ts
        ownership: shared
  - invariant: content-uses-trusted-templates
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/notification.ts
        ownership: shared
      - type: test
        path: src/notification.test.ts
        ownership: shared
  - invariant: recipient-destination-is-server-resolved
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/notification.ts
        ownership: shared
      - type: test
        path: src/notification.test.ts
        ownership: shared
  - invariant: consent-is-enforced
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/notification.ts
        ownership: shared
      - type: test
        path: src/notification.test.ts
        ownership: shared
  - invariant: delivery-is-idempotent
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/notification.ts
        ownership: shared
      - type: test
        path: src/notification.test.ts
        ownership: shared
  - invariant: delivery-failure-is-visible
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/notification.ts
        ownership: shared
      - type: test
        path: src/notification.test.ts
        ownership: shared
  - invariant: receipts-and-audit-are-minimized
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/notification.ts
        ownership: shared
      - type: test
        path: src/notification.test.ts
        ownership: shared
