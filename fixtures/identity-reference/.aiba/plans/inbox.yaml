apiVersion: aiba.dev/v0alpha1
kind: OperationPlan
metadata:
  id: inbox-install
  createdAt: 2026-07-26T00:11:00.000Z
capability:
  id: inbox
  version: 0.1.0
  manifestSha256: 5b0b32eb2b050525fc04ce9a13f1783999f7bdfabda32864514421b74e5633c6
recipe:
  id: typescript-reference
  version: 0.1.0
  sha256: 409ae1ae61538ac5b5cbbb6061c785e696a1b54305b45942a16b03a34ce8d1ec
project:
  name: "@aiba/fixture-identity-reference"
  stack:
    languages:
      - TypeScript
    frameworks: []
writeScope:
  allowedPatterns:
    - src/**
    - server/**
    - workers/**
    - test/**
    - tests/**
operations:
  - id: ingest-trusted-message
    intent: Create one recipient-scoped message from a trusted event and immutable
      server template.
    requiredInterfaces:
      - inbox.message-record
      - audit.event
    invariants:
      - message-content-is-trusted
      - records-and-audit-are-minimized
    guidance:
      - Accept events only from authenticated internal adapters and resolve
        versioned templates on the server.
      - Deduplicate the trusted source event and sanitize bounded rendered text
        before persistence.
  - id: list-principal-inbox
    intent: Authorize and list only the authenticated principal's messages with a
      signed scoped cursor.
    requiredInterfaces:
      - inbox.query-command
      - inbox.page
      - authorization.decision
    invariants:
      - inbox-scope-is-context-derived
      - inbox-operations-are-authorized
      - pagination-is-bounded-and-scoped
      - records-and-audit-are-minimized
    guidance:
      - Derive tenant and recipient from authentication and filter before
        pagination.
      - Bind cursor integrity to principal, filters, stable sort, and offset.
  - id: transition-message-state
    intent: Atomically mark a bounded set of messages read, unread, or archived.
    requiredInterfaces:
      - inbox.transition-command
      - inbox.transition-result
      - authorization.decision
      - audit.event
    invariants:
      - inbox-scope-is-context-derived
      - inbox-operations-are-authorized
      - transitions-are-revisioned-and-idempotent
      - records-and-audit-are-minimized
    guidance:
      - Authorize the context-derived inbox, compare every revision, then mutate
        the complete batch in one transaction.
      - Bind tenant and principal scoped idempotency to action and targets
        without auditing message content.
evidence:
  - invariant: inbox-scope-is-context-derived
    requirements: &a1
      acceptedTypes:
        - source
        - test
        - config
        - document
      requiredTypes:
        - source
        - test
      minimum: 2
      requireHash: true
    suggestions: &a2
      - type: source
        pathPattern: src/**/*.ts
        description: Trusted event ingestion, scoped query, cursor, and transition boundary.
      - type: test
        pathPattern: src/**/*.test.ts
        description: Scope injection, authorization, cursor, revision, race,
          idempotency, and minimization tests.
    items:
      - type: source
        path: src/inbox.ts
        ownership: shared
      - type: test
        path: src/inbox.test.ts
        ownership: shared
  - invariant: message-content-is-trusted
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/inbox.ts
        ownership: shared
      - type: test
        path: src/inbox.test.ts
        ownership: shared
  - invariant: inbox-operations-are-authorized
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/inbox.ts
        ownership: shared
      - type: test
        path: src/inbox.test.ts
        ownership: shared
  - invariant: pagination-is-bounded-and-scoped
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/inbox.ts
        ownership: shared
      - type: test
        path: src/inbox.test.ts
        ownership: shared
  - invariant: transitions-are-revisioned-and-idempotent
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/inbox.ts
        ownership: shared
      - type: test
        path: src/inbox.test.ts
        ownership: shared
  - invariant: records-and-audit-are-minimized
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/inbox.ts
        ownership: shared
      - type: test
        path: src/inbox.test.ts
        ownership: shared
