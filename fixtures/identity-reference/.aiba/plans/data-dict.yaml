apiVersion: aiba.dev/v0alpha1
kind: OperationPlan
metadata:
  id: data-dict-install
  createdAt: 2026-07-26T00:23:00.000Z
capability:
  id: data-dict
  version: 0.1.0
  manifestSha256: ae61def0c7e27397503aa454e4c363f4e43bb37c05c24e20839e15d6b6bb532d
recipe:
  id: typescript-reference
  version: 0.1.0
  sha256: adcd472607e7a25c892a60cca4fbc15ee1cadd52e6dc0f52e1dd5bb17c2736fc
project:
  name: "@aiba/fixture-identity-reference"
  stack:
    languages:
      - TypeScript
      - JavaScript
    frameworks: []
writeScope:
  allowedPatterns:
    - src/**
    - server/**
    - test/**
    - tests/**
operations:
  - id: query-scoped-dictionary
    intent: Load, validate, filter, and page one trusted tenant dictionary revision.
    requiredInterfaces:
      - data-dict.query-command
      - data-dict.query-result
      - data-dict.item-record
    invariants:
      - values-are-bound
      - tenant-isolation
      - revisions-are-immutable
      - disabled-items-excluded
      - labels-are-sanitized
    guidance:
      - Derive tenant scope from authentication and compare the requested
        revision before returning values.
      - Validate stored value types, exclude disabled items by default, bound
        pages, and sanitize labels.
  - id: validate-dictionary-value
    intent: Validate one application mutation value against an enabled dictionary
      item and exact revision.
    requiredInterfaces:
      - data-dict.item-record
    invariants:
      - values-are-bound
      - tenant-isolation
      - revisions-are-immutable
      - disabled-items-excluded
    guidance:
      - Resolve dictionary and item in the trusted tenant before accepting the
        application mutation.
      - Reject disabled, missing, mistyped, stale, or cyclic hierarchy data
        without coercion.
evidence:
  - invariant: values-are-bound
    requirements: &a1
      acceptedTypes:
        - source
        - test
        - config
        - document
      requiredTypes:
        - source
        - test
      minimum: 2
      requireHash: true
    suggestions: &a2
      - type: source
        pathPattern: src/**/*.ts
        description: Typed scoped dictionary query and mutation validation boundary.
      - type: test
        pathPattern: src/**/*.test.ts
        description: Tenant, type, disabled item, revision, hierarchy, bounds, and
          sanitization tests.
    items:
      - type: source
        path: src/data-dict.ts
        ownership: shared
      - type: test
        path: src/data-dict.test.ts
        ownership: shared
  - invariant: tenant-isolation
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/data-dict.ts
        ownership: shared
      - type: test
        path: src/data-dict.test.ts
        ownership: shared
  - invariant: revisions-are-immutable
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/data-dict.ts
        ownership: shared
      - type: test
        path: src/data-dict.test.ts
        ownership: shared
  - invariant: disabled-items-excluded
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/data-dict.ts
        ownership: shared
      - type: test
        path: src/data-dict.test.ts
        ownership: shared
  - invariant: labels-are-sanitized
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/data-dict.ts
        ownership: shared
      - type: test
        path: src/data-dict.test.ts
        ownership: shared
