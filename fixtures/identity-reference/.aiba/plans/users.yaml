    requirements: &a1
      acceptedTypes:
        - source
        - test
        - config
        - document
      requiredTypes:
        - source
        - test
      minimum: 2
      requireHash: true
    suggestions: &a2
      - type: source
        pathPattern: src/**/*.ts
        description: Authorized user lifecycle implementation.
      - type: test
        pathPattern: src/**/*.test.ts
        description: Tenant, lifecycle, and mutation tests.
    items:
