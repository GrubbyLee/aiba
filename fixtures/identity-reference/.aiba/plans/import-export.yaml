        - test
      minimum: 2
      requireHash: true
    suggestions: &a2
      - type: source
        pathPattern: src/**/*.ts
        description: Profile-driven import/export lifecycle implementation.
      - type: test
        pathPattern: src/**/*.test.ts
        description: Tenant, authorization, injection, limits, atomicity, idempotency,
          export, and redaction tests.
    items:
