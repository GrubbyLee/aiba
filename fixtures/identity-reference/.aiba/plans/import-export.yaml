recipe:
  id: typescript-reference
  version: 0.1.0
  sha256: 7d4630109d36eddd0cb212c50898c2f2bdfe2e00985450479dfeb0bfbef6643f
project:
  name: "@aiba/fixture-identity-reference"
  stack:
    languages:
      - TypeScript
      - JavaScript
    frameworks: []
writeScope:
  allowedPatterns:
    - src/**
    - server/**
    - test/**
    - tests/**
    - cloudfunctions/**
operations:
  - id: establish-trusted-exchange-profile
    intent: Resolve an enabled import or export profile inside the authenticated
      tenant without accepting caller-owned execution details.
    requiredInterfaces:
      - identity.principal
    invariants:
      - tenant-comes-from-trusted-context
      - profiles-are-server-owned
    guidance:
      - Accept only the portable profile and opaque asset identifiers defined by
        the command interface.
      - Keep formats, tables, queries, mappings, fields, limits, destinations,
        and callbacks in trusted configuration.
  - id: authorize-and-deduplicate-exchange
    intent: Authorize the exact profile operation and bind the tenant-scoped
      idempotency key to one command fingerprint.
    requiredInterfaces:
      - authorization.decision
    invariants:
      - exchange-operations-are-authorized
      - exchange-jobs-are-idempotent
    guidance:
      - Bind the authorization decision to principal, tenant, operation, and
        profile resource.
      - Scope the durable idempotency key by tenant and operation before
        executing data work.
  - id: validate-private-import
    intent: Read a verified private source asset and validate all rows within
      trusted profile limits before persistence.
    requiredInterfaces:
      - authorization.decision
      - file-assets.record
      - import-export.import-command
    invariants:
      - import-sources-are-private-assets
      - import-processing-is-bounded
      - imported-rows-are-schema-validated
    guidance:
      - Require a decision bound to the exact private source asset before
        reading it.
      - Stream or incrementally parse with hard byte, row, field, cell, time,
        and retained-error limits.
      - Reject unknown or dangerous field names, invalid types, missing values,
        and duplicate trusted unique keys.
  - id: commit-import-atomically
    intent: Commit accepted rows and required provenance without exposing partial
      business mutations.
    requiredInterfaces:
      - audit.event
      - import-export.job-record
    invariants:
      - import-commit-is-atomic
      - jobs-errors-and-audit-are-minimized
    guidance:
      - Use one database transaction for bounded imports or durable checkpoints
        and an outbox for explicitly chunked jobs.
      - Never record row values in the job, validation error, log, or audit
        event.
  - id: produce-policy-filtered-export
    intent: Select tenant-scoped allowlisted fields and encode
      spreadsheet-compatible output without executable cells.
    requiredInterfaces:
      - import-export.export-command
    invariants:
      - exports-apply-trusted-data-policy
      - spreadsheet-formulas-are-neutralized
    guidance:
      - Derive tenant filters from trusted context and select only
        profile-declared fields.
      - Neutralize formula prefixes before ordinary CSV quoting or use an
        equivalent safe encoder.
  - id: publish-private-exchange-result
    intent: Store outputs and bounded error reports as private assets and return
      only minimized job metadata.
    requiredInterfaces:
      - file-assets.record
      - import-export.job-record
      - audit.event
    invariants:
      - exchange-results-are-private-assets
      - jobs-errors-and-audit-are-minimized
    guidance:
      - Return opaque private asset identifiers rather than storage keys, paths,
        URLs, or credentials.
      - Clean up unpublished results when finalization or required audit
        delivery fails.
evidence:
