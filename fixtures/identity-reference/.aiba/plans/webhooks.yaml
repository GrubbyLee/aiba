apiVersion: aiba.dev/v0alpha1
kind: OperationPlan
metadata:
  id: webhooks-install
  createdAt: 2026-07-26T00:33:00.000Z
capability:
  id: webhooks
  version: 0.1.0
  manifestSha256: bf387544b85bd60e9a82dd07e4f2356dd0cf68f1c0235d7775eb5ba101c49f96
recipe:
  id: typescript-reference
  version: 0.1.0
  sha256: e080bfb07bd4c4a6c674f8b5bd8332e2a76209b1f46add8bb39d17f6734a99f8
project:
  name: "@aiba/fixture-identity-reference"
  stack:
    languages:
      - TypeScript
    frameworks: []
writeScope:
  allowedPatterns:
    - src/**
    - server/**
    - test/**
    - tests/**
    - workers/**
operations:
  - id: enqueue-trusted-event
    intent: Authorize and deduplicate an event selected from trusted subscription
      and projection registries.
    requiredInterfaces:
      - webhooks.delivery-command
      - webhooks.delivery-record
      - authorization.decision
      - audit.event
    invariants:
      - destinations-and-secrets-are-trusted
      - event-projections-are-server-owned
      - delivery-is-authorized-and-idempotent
    guidance:
      - Resolve tenant, HTTPS URL, secret, allowed event types, and projection
        from server configuration.
      - Bind the scoped idempotency key before acknowledging enqueue.
  - id: sign-deliver-and-verify
    intent: Deliver a canonical signed body and reject stale, tampered, or replayed
      receiver requests.
    requiredInterfaces:
      - webhooks.delivery-record
      - audit.event
    invariants:
      - deliveries-are-signed-and-fresh
      - retries-and-records-are-bounded
    guidance:
      - Sign the exact timestamp, unique delivery ID, and raw body; compare
        signatures in constant time.
      - Persist receiver replay state for at least the accepted timestamp window
        and minimize failure records.
evidence:
  - invariant: destinations-and-secrets-are-trusted
    requirements: &a1
      acceptedTypes:
        - source
        - test
        - config
        - document
      requiredTypes:
        - source
        - test
      minimum: 2
      requireHash: true
    suggestions: &a2
      - type: source
        pathPattern: src/**/*.ts
        description: Webhook subscription, delivery, and receiver boundary.
      - type: test
        pathPattern: src/**/*.test.ts
        description: Destination, signature, freshness, replay, retry, idempotency, and
          redaction tests.
    items:
      - type: source
        path: src/webhooks.ts
        ownership: shared
      - type: test
        path: src/webhooks.test.ts
        ownership: shared
  - invariant: event-projections-are-server-owned
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/webhooks.ts
        ownership: shared
      - type: test
        path: src/webhooks.test.ts
        ownership: shared
  - invariant: deliveries-are-signed-and-fresh
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/webhooks.ts
        ownership: shared
      - type: test
        path: src/webhooks.test.ts
        ownership: shared
  - invariant: delivery-is-authorized-and-idempotent
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/webhooks.ts
        ownership: shared
      - type: test
        path: src/webhooks.test.ts
        ownership: shared
  - invariant: retries-and-records-are-bounded
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/webhooks.ts
        ownership: shared
      - type: test
        path: src/webhooks.test.ts
        ownership: shared
