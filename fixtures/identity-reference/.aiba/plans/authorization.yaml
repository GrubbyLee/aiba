apiVersion: aiba.dev/v0alpha1
kind: OperationPlan
metadata:
  id: authorization-install
  createdAt: 2026-07-26T00:05:00.000Z
capability:
  id: authorization
  version: 0.1.0
  manifestSha256: ab62dc64cff64a95f6cecde994fc8d1c8480d96db08d3c1aae9506bc21286b43
recipe:
  id: typescript-reference
  version: 0.1.0
  sha256: 2a1639ce46a446b891b8eeee54934cad42c0b71c895ccc077be53f89611becfa
project:
  name: "@aiba/fixture-identity-reference"
  stack:
    languages:
      - TypeScript
      - JavaScript
    frameworks: []
writeScope:
  allowedPatterns:
    - src/**
    - server/**
    - test/**
    - tests/**
    - cloudfunctions/**
operations:
  - id: establish-decision-boundary
    intent: Separate trusted principal context from a bounded action and resource
      request.
    requiredInterfaces:
      - identity.principal
      - authorization.decision
    invariants:
      - principal-comes-from-trusted-context
      - action-and-resource-are-explicit
      - decisions-are-attributable
    guidance:
      - Reject payload fields for principal, tenant context, role, permission,
        policy, or decision outcome.
      - Return one explicit decision with a server-derived identifier, reason,
        policy version, and timestamp.
  - id: evaluate-policy-fail-closed
    intent: Evaluate trusted policy with default deny and explicit deny precedence.
    requiredInterfaces:
      - authorization.decision
    invariants:
      - decisions-default-to-deny
      - deny-takes-precedence
      - policy-is-server-authoritative
    guidance:
      - Treat missing, malformed, unavailable, or ambiguous policy as denial.
      - Avoid implicit wildcard grants; make broad access explicit and
        independently reviewable.
  - id: enforce-tenant-boundary
    intent: Deny object access across tenant boundaries before evaluating allow grants.
    requiredInterfaces:
      - authorization.decision
    invariants:
      - tenant-boundaries-are-enforced
    guidance:
      - Compare trusted principal and resource tenant identifiers before policy
        grant matching.
      - Add object-level authorization tests for attacker-selected resource
        identifiers.
  - id: audit-policy-decisions
    intent: Record every allow and deny outcome without permitting audit failure to
      become access.
    requiredInterfaces:
      - audit.event
    invariants:
      - decisions-are-audited
    guidance:
      - Record stable decision and reason identifiers without sensitive resource
        contents.
      - Fail closed when required decision auditing cannot be completed.
evidence:
  - invariant: principal-comes-from-trusted-context
    requirements: &a1
      acceptedTypes:
        - source
        - test
        - config
        - document
      requiredTypes:
        - source
        - test
      minimum: 2
      requireHash: true
    suggestions: &a2
      - type: source
        pathPattern: src/**/*.ts
        description: Server-side authorization implementation.
      - type: test
        pathPattern: src/**/*.test.ts
        description: Policy, tenant-isolation, and fail-closed tests.
    items:
      - type: source
        path: src/authorization.ts
        ownership: shared
      - type: test
        path: src/authorization.test.ts
        ownership: shared
  - invariant: decisions-default-to-deny
    requirements: *a1
    suggestions: *a2
    items:
