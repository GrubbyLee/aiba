apiVersion: aiba.dev/v0alpha1
kind: OperationPlan
metadata:
  id: i18n-install
  createdAt: 2026-07-26T00:21:00.000Z
capability:
  id: i18n
  version: 0.1.0
  manifestSha256: 0c9bebb83d0796604da7bfe229b25e9cd7c272f9fdbe61fc2a68225f191b489c
recipe:
  id: typescript-reference
  version: 0.1.0
  sha256: c11d0e82210ed4926155fd1feb533a7ac0d2d7470ae5fb8c72fbceefddd9ccd6
project:
  name: "@aiba/fixture-identity-reference"
  stack:
    languages:
      - TypeScript
      - JavaScript
    frameworks: []
writeScope:
  allowedPatterns:
    - src/**
    - server/**
    - test/**
    - tests/**
operations:
  - id: load-revisioned-catalog
    intent: Load and verify one immutable locale catalog revision from trusted storage.
    requiredInterfaces:
      - i18n.catalog-command
      - i18n.catalog-result
    invariants:
      - catalog-is-revisioned
      - keys-are-namespaced
      - plural-rules-are-validated
    guidance:
      - Verify the content-derived revision before exposing any namespace.
      - Reject malformed key names and plural categories outside the fixed
        locale rules.
  - id: translate-trusted-locale
    intent: Resolve trusted locale context and translate a bounded set of keys
      deterministically.
    requiredInterfaces:
      - i18n.translate-command
      - i18n.translate-result
    invariants:
      - locale-is-trusted
      - keys-are-namespaced
      - interpolation-is-sanitized
      - fallback-is-deterministic
      - plural-rules-are-validated
    guidance:
      - Resolve locale from authenticated preference, tenant default, and
        bounded language negotiation.
      - Sanitize interpolation values and cap the fallback chain before
        returning minimized results.
evidence:
  - invariant: locale-is-trusted
    requirements: &a1
      acceptedTypes:
        - source
        - test
        - config
        - document
      requiredTypes:
        - source
        - test
      minimum: 2
      requireHash: true
    suggestions: &a2
      - type: source
        pathPattern: src/**/*.ts
        description: Trusted locale, catalog revision, lookup, fallback, plural, and
          interpolation boundary.
      - type: test
        pathPattern: src/**/*.test.ts
        description: Forged locale, malformed key, injection, revision, fallback, and
          plural tests.
    items:
      - type: source
        path: src/i18n.ts
        ownership: shared
      - type: test
        path: src/i18n.test.ts
        ownership: shared
  - invariant: keys-are-namespaced
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/i18n.ts
        ownership: shared
      - type: test
        path: src/i18n.test.ts
        ownership: shared
  - invariant: interpolation-is-sanitized
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/i18n.ts
        ownership: shared
      - type: test
        path: src/i18n.test.ts
        ownership: shared
  - invariant: catalog-is-revisioned
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/i18n.ts
        ownership: shared
      - type: test
        path: src/i18n.test.ts
        ownership: shared
  - invariant: fallback-is-deterministic
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/i18n.ts
        ownership: shared
      - type: test
        path: src/i18n.test.ts
        ownership: shared
  - invariant: plural-rules-are-validated
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/i18n.ts
        ownership: shared
      - type: test
        path: src/i18n.test.ts
        ownership: shared
