apiVersion: aiba.dev/v0alpha1
kind: OperationPlan
metadata:
  id: feature-flags-install
  createdAt: 2026-07-26T00:17:00.000Z
capability:
  id: feature-flags
  version: 0.1.0
  manifestSha256: 4accb66df80c0720a8b4c6d1414bf0829e9dda09f9688c8dda90210c9a565c3f
recipe:
  id: typescript-reference
  version: 0.1.0
  sha256: fc9b04f3ec54f7e2251451d24ed226801df3fbaf0a243e54c1e3743387a052ed
project:
  name: "@aiba/fixture-identity-reference"
  stack:
    languages:
      - TypeScript
      - JavaScript
    frameworks: []
writeScope:
  allowedPatterns:
    - src/**
    - server/**
    - test/**
    - tests/**
operations:
  - id: evaluate-revisioned-policy
    intent: Resolve trusted context and one tenant-bound policy revision into a
      minimized decision.
    requiredInterfaces:
      - feature-flags.evaluation-command
      - feature-flags.evaluation-result
    invariants:
      - context-is-trusted
      - policy-is-revisioned
      - rollout-is-deterministic
      - allocation-is-bounded
      - evaluation-is-minimized
    guidance:
      - Derive tenant, stable subject key, and allowlisted attributes from
        authenticated server state.
      - Hash a secret server salt, flag key, and stable subject into a fixed
        10000-bucket rollout.
      - Reject stale expected revisions and invalid allocation; never expose
        targeting inputs or salts.
evidence:
  - invariant: context-is-trusted
    requirements: &a1
      acceptedTypes:
        - source
        - test
        - config
        - document
      requiredTypes:
        - source
        - test
      minimum: 2
      requireHash: true
    suggestions: &a2
      - type: source
        pathPattern: src/**/*.ts
        description: Trusted context and deterministic evaluation boundary.
      - type: test
        pathPattern: src/**/*.test.ts
        description: Scope, revision, targeting, determinism, allocation, and
          minimization tests.
    items:
      - type: source
        path: src/feature-flags.ts
        ownership: shared
      - type: test
        path: src/feature-flags.test.ts
        ownership: shared
  - invariant: policy-is-revisioned
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/feature-flags.ts
        ownership: shared
      - type: test
        path: src/feature-flags.test.ts
        ownership: shared
  - invariant: rollout-is-deterministic
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/feature-flags.ts
        ownership: shared
      - type: test
        path: src/feature-flags.test.ts
        ownership: shared
  - invariant: allocation-is-bounded
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/feature-flags.ts
        ownership: shared
      - type: test
        path: src/feature-flags.test.ts
        ownership: shared
  - invariant: evaluation-is-minimized
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/feature-flags.ts
        ownership: shared
      - type: test
        path: src/feature-flags.test.ts
        ownership: shared
