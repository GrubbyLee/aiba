project:
  name: "@aiba/fixture-identity-reference"
  stack:
    languages:
      - TypeScript
      - JavaScript
    frameworks: []
writeScope:
  allowedPatterns:
    - src/**
    - server/**
    - test/**
    - tests/**
operations:
  - id: mutate-membership
    intent: Add, change, or remove one member within trusted tenant and organization
      scope.
    requiredInterfaces:
      - organization.membership-command
      - organization.membership-record
      - authorization.decision
      - audit.event
    invariants:
      - scope-is-context-derived
      - membership-mutations-are-authorized
      - users-and-roles-are-trusted
      - mutations-are-revisioned-and-idempotent
      - last-owner-is-preserved
      - membership-audit-is-minimized
    guidance:
      - Resolve scope from authenticated context and validate users and roles
        against tenant-bound stores.
      - Compare revision, enforce last-owner count, mutate, and bind idempotency
        in one transaction.
      - Return stable conflict codes and minimized membership records.
evidence:
  - invariant: scope-is-context-derived
    requirements: &a1
      acceptedTypes:
        - source
        - test
        - config
        - document
      requiredTypes:
        - source
        - test
      minimum: 2
      requireHash: true
    suggestions: &a2
      - type: source
        pathPattern: src/**/*.ts
        description: Organization membership boundary and transactional storage.
      - type: test
        pathPattern: src/**/*.test.ts
        description: Scope, authorization, role, revision, idempotency, last-owner, and
          redaction tests.
    items:
      - type: source
        path: src/organization.ts
        ownership: shared
      - type: test
        path: src/organization.test.ts
        ownership: shared
  - invariant: membership-mutations-are-authorized
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/organization.ts
        ownership: shared
      - type: test
        path: src/organization.test.ts
        ownership: shared
  - invariant: users-and-roles-are-trusted
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/organization.ts
        ownership: shared
      - type: test
        path: src/organization.test.ts
        ownership: shared
  - invariant: mutations-are-revisioned-and-idempotent
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/organization.ts
        ownership: shared
      - type: test
        path: src/organization.test.ts
        ownership: shared
  - invariant: last-owner-is-preserved
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/organization.ts
        ownership: shared
      - type: test
        path: src/organization.test.ts
        ownership: shared
  - invariant: membership-audit-is-minimized
    requirements: *a1
    suggestions: *a2
    items:
      - type: source
        path: src/organization.ts
        ownership: shared
      - type: test
        path: src/organization.test.ts
        ownership: shared
