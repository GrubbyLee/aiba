name: Sync to Gitee

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-to-gitee
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          GITEE_SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          [ -n "$GITEE_SSH_KEY" ] || { echo "::error::Missing Secret: GITEE_SSH_KEY"; exit 1; }

      - name: Configure Gitee SSH
        env:
          GITEE_SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$GITEE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' 'gitee.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEKxHSJ7084RmkJ4YdEi5tngynE8aZe2uEoVVsB/OvYN' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare Chinese Gitee landing page
        run: |
          cp README.md README.en.md
          cp README.zh-CN.md README.md
          sed -i 's#href="README.md"#href="README.en.md"#' README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md
          git commit -m "docs: use Chinese README on Gitee [skip ci]"

      - name: Push main and tags to Gitee
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git remote add gitee "git@gitee.com:synovation/aiba.git"
          timeout 120s git push gitee HEAD:main --force
          timeout 120s git push gitee --tags --force
