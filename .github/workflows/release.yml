name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to publish
        required: true
        default: v0.1.0

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: npm install --global npm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: test "$(git cat-file -t "$AIBA_RELEASE_TAG")" = tag
      - run: pnpm check
      - run: pnpm pack:artifacts
      - run: node scripts/release/notes.mjs "$AIBA_RELEASE_TAG" > release-notes.md
      - name: Create or update GitHub Release
        run: |
          if gh release view "$AIBA_RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$AIBA_RELEASE_TAG" --title "AIBA $AIBA_RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$AIBA_RELEASE_TAG" artifacts/*.tgz --clobber
          else
            gh release create "$AIBA_RELEASE_TAG" artifacts/*.tgz --verify-tag --title "AIBA $AIBA_RELEASE_TAG" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/release/publish.mjs --dir artifacts
    env:
      AIBA_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
