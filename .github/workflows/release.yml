name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
      - run: pnpm check
      - run: pnpm pack:artifacts
      - run: node scripts/release/publish.mjs --dir artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: node scripts/release/notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - run: gh release create "$GITHUB_REF_NAME" artifacts/*.tgz --verify-tag --title "AIBA $GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
    env:
      AIBA_RELEASE_TAG: ${{ github.ref_name }}
